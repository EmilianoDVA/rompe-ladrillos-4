<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Rompeladrillos</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.93.0"></script>

<!-- ============ CSS: la piel del juego (colores, tamaños, posiciones) ============ -->
<style>
  :root { --fondo:#14213d; --marco:#fca311; --texto:#e5e5e5; }
  html { overscroll-behavior: none; }
  body {
    margin:0; padding:10px; box-sizing:border-box; min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    background:var(--fondo); color:var(--texto);
    font-family: Georgia, "Times New Roman", serif;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    touch-action: manipulation;
  }
  h1 { margin:0; font-size:clamp(1.5rem, 6vw, 2rem); letter-spacing:1px; }
  #info { font-size:clamp(0.95rem, 3.6vw, 1.1rem); display:flex; flex-wrap:wrap; justify-content:center; gap:8px 22px; }
  canvas {
    background:#0b132b; border:4px solid var(--marco); border-radius:6px;
    width:min(calc(96vw - 8px), 632px, calc(113vh - 8px)); height:auto; aspect-ratio:640 / 440;
    touch-action:none; display:block;
  }
  p { margin:0; opacity:.8; text-align:center; font-size:clamp(0.85rem, 3.4vw, 1rem); }
  #zonaSonido { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:10px 12px; }
  #zonaSonido button {
    font-family:inherit; font-size:1rem; padding:10px 16px; cursor:pointer;
    background:var(--marco); color:#14213d; border:none; border-radius:8px; font-weight:bold;
  }
  #audioEstado { font-size:0.85rem; opacity:.8; }

  /* --- Cuentas y ranking --- */
  input { -webkit-user-select:text; user-select:text; }
  .oculto { display:none !important; }
  #cuenta { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:8px 10px; font-size:clamp(0.85rem, 3.4vw, 1rem); }
  #cuenta button { font-family:inherit; cursor:pointer; border:none; border-radius:8px; font-weight:bold; font-size:0.9rem; padding:7px 12px; background:#2b3a67; color:var(--texto); }
  #modal { position:fixed; inset:0; background:rgba(5,10,25,.82); display:flex; align-items:center; justify-content:center; padding:14px; z-index:50; }
  #tarjeta { position:relative; width:min(420px, 100%); max-height:92vh; overflow:auto; background:#1b2a4e; border:3px solid var(--marco); border-radius:12px; padding:22px 20px; box-sizing:border-box; }
  #tarjeta h2 { margin:0 0 12px; text-align:center; font-size:1.4rem; }
  #tarjeta button { font-family:inherit; cursor:pointer; border:none; border-radius:8px; font-weight:bold; }
  #cerrarModal { position:absolute; top:8px; right:10px; background:none; color:var(--texto); font-size:1.3rem; padding:4px 8px; }
  .pestanas { display:flex; gap:8px; margin-bottom:12px; }
  .pestanas button { flex:1; padding:9px; background:#2b3a67; color:var(--texto); }
  .pestanas button.activa { background:var(--marco); color:#14213d; }
  #tarjeta label { display:block; margin:10px 0 0; font-size:.95rem; }
  #tarjeta input { display:block; width:100%; box-sizing:border-box; margin-top:4px; padding:11px; font-size:16px; border-radius:8px; border:2px solid #3b4d80; background:#0f1a36; color:var(--texto); font-family:inherit; }
  #enviarCuenta { width:100%; margin-top:16px; padding:12px; font-size:1.05rem; background:var(--marco); color:#14213d; }
  #mensajeCuenta, #mensajeRanking { min-height:1.2em; margin:10px 0 0; font-size:.92rem; color:#ffd84d; opacity:1; }
  .nota { font-size:.8rem; opacity:.75; margin-top:12px; }
  #tarjeta .enlace { display:block; margin:12px auto 0; background:none; color:var(--texto); text-decoration:underline; font-weight:normal; font-size:.9rem; padding:6px; }
  #listaRanking { list-style:none; margin:0; padding:0; }
  #listaRanking li { display:flex; justify-content:space-between; gap:10px; padding:8px 10px; border-bottom:1px solid #2f4073; font-size:1rem; }
  #listaRanking li.yo { background:#33497f; border-radius:6px; }
</style>
</head>

<body>
<!-- ============ HTML: el esqueleto (qué hay en la página) ============ -->
<h1>Rompeladrillos</h1>
<div id="info">
  <span>Nivel: <b id="nivelTexto">1</b></span>
  <span>Puntos: <b id="puntos">0</b></span>
  <span>Vidas: <b id="vidas">3</b></span>
</div>
<div id="cuenta">
  <span id="cuentaTexto">Conectando…</span>
  <button id="btnCuenta">👤 Entrar / Crear cuenta</button>
  <button id="btnRanking">🏆 Ranking</button>
</div>
<canvas id="juego" width="640" height="440"></canvas>
<p id="ayuda"></p>
<div id="zonaSonido">
  <button id="pausa">⏯ Pausar / seguir</button>
  <button id="probar">🔊 Probar sonidos</button>
  <span id="audioEstado">Cada clic suena un sonido distinto</span>
</div>

<!-- ============ VENTANA DE CUENTA Y RANKING ============ -->
<div id="modal" class="oculto">
  <div id="tarjeta">
    <button id="cerrarModal" aria-label="Cerrar">✕</button>

    <div id="vistaCuenta">
      <h2>Rompeladrillos</h2>
      <p>Para jugar necesitas una cuenta.</p>
      <div class="pestanas">
        <button id="pestEntrar" class="activa">Entrar</button>
        <button id="pestCrear">Crear cuenta</button>
      </div>
      <label id="lblUsuario" class="oculto">Usuario (3 a 16 letras, números o _)
        <input id="campoUsuario" type="text" maxlength="16" autocomplete="username" autocapitalize="none" spellcheck="false">
      </label>
      <label>Correo
        <input id="campoCorreo" type="email" autocomplete="email" autocapitalize="none" spellcheck="false">
      </label>
      <label>Contraseña (mínimo 8 caracteres)
        <input id="campoClave" type="password" autocomplete="current-password">
      </label>
      <button id="enviarCuenta">Entrar</button>
      <p id="mensajeCuenta"></p>
      <p class="nota">Tu correo solo se usa para tu cuenta y no se muestra a nadie. Tu usuario y tu mejor puntaje sí aparecen en el ranking.</p>
    </div>

    <div id="vistaRanking" class="oculto">
      <h2>🏆 Mejores jugadores</h2>
      <ol id="listaRanking"></ol>
      <p id="mensajeRanking"></p>
    </div>
  </div>
</div>

<!-- ============ JAVASCRIPT: el cerebro (qué hace el juego) ============ -->
<script>
// 1) PREPARAR EL LIENZO: "canvas" es una hoja en blanco donde dibujamos.
const lienzo = document.getElementById("juego");
const pincel = lienzo.getContext("2d");

// 2) VARIABLES: cajitas con nombre donde guardamos datos que cambian.
let puntos = 0;
let vidas = 3;
let nivel = 1;
let estado = "esperando";   // "esperando", "jugando", "nivelCompleto" o "terminado"
let cuentaNivel = 0;        // cuenta regresiva de la celebración de nivel
let bloqueoHasta = 0;       // evita iniciar o reiniciar sin querer al levantar el dedo
let vistaActual = null;     // qué ventana está abierta: "cuenta", "ranking" o ninguna

// ¿Estamos en un celular o tableta? Entonces cambiamos las instrucciones.
const esTactil = window.matchMedia("(pointer: coarse)").matches || "ontouchstart" in window;
const textoAccion = esTactil ? "toca la pantalla" : "presiona espacio";
document.getElementById("ayuda").textContent = esTactil
  ? "Arrastra el dedo sobre el juego para mover la barra. Toca para iniciar."
  : "Mueve la barra con ← → o con el mouse. Espacio para iniciar o pausar.";

// 3) OBJETOS: agrupan datos de una misma cosa (el niño que brinca, la barra).
const pelota = { x:320, y:380, radio:13, dx:4, dy:-4 };   // dx/dy = velocidad horizontal/vertical
const barra  = { ancho:200, alto:12, x:270, y:410, velocidad:7 };

// 4) LADRILLOS REDONDOS. Cada nivel es más difícil:
//    más filas, círculos más chicos, barra más angosta y niño más rápido.
let filas = 5;
const columnas = 9;
let radioLadrillo = 24;
const colores = ["#e63946","#f77f00","#fca311","#8ecae6","#06d6a0","#9b5de5","#f15bb5"];
let ladrillos = [];

function crearLadrillos() {
  filas = Math.min(4 + nivel, 7);                          // nivel 1: 5 filas, nivel 2: 6, nivel 3 o más: 7
  radioLadrillo = Math.max(15, 27 - nivel * 3);            // nivel 1: 24, nivel 2: 21, nivel 3: 18...
  barra.ancho = Math.max(110, 200 - (nivel - 1) * 25);     // la barra se va haciendo más angosta
  const separacionFilas = radioLadrillo * 2 + 6;
  ladrillos = [];
  for (let f = 0; f < filas; f++) {
    for (let c = 0; c < columnas; c++) {
      ladrillos.push({
        x: 48 + c * 68,                   // centro del círculo (horizontal)
        y: 40 + f * separacionFilas,      // centro del círculo (vertical)
        fila: f,                          // a qué grupo de color pertenece
        color: colores[f],
        vivo: true
      });
    }
  }
}

// 5) FONDO DE COLORES: una lista de colores que se mezclan poco a poco.
//    Cada color es [rojo, verde, azul]. Orden: rojo, morado, azul, turquesa, verde, amarillo, naranja.
const fondoColores = [
  [170,30,40], [110,40,160], [40,70,180], [30,150,170],
  [40,150,80], [180,160,40], [190,100,30]
];
let faseFondo = 0;   // en qué punto del recorrido de colores vamos

function colorFondo() {
  const total = fondoColores.length;
  const i = Math.floor(faseFondo) % total;       // color actual
  const j = (i + 1) % total;                     // color siguiente
  const t = faseFondo - Math.floor(faseFondo);   // cuánto llevamos de la mezcla (0 a 1)
  const mezcla = fondoColores[i].map((v, k) => Math.round(v + (fondoColores[j][k] - v) * t));
  return `rgb(${mezcla[0]},${mezcla[1]},${mezcla[2]})`;
}

// 6) SONIDOS: todos se crean con código, no necesitan archivos de audio.
let audio = null;

function activarAudio() {
  // El navegador solo deja sonar el audio después de que la persona toca algo.
  if (!audio) {
    audio = new (window.AudioContext || window.webkitAudioContext)();
    // Truco para iPhone: un sonido vacío que "destapa" el audio.
    const vacio = audio.createBuffer(1, 1, 22050);
    const fuente = audio.createBufferSource();
    fuente.buffer = vacio;
    fuente.connect(audio.destination);
    fuente.start(0);
  }
  if (audio.state === "suspended") audio.resume();
}

// Una sola nota musical: la usamos para armar las melodías de celebración.
function nota(frecuencia, inicio, duracion, tipo, fuerza) {
  const t = audio.currentTime + inicio;
  const osc = audio.createOscillator();
  const volumen = audio.createGain();
  osc.type = tipo;
  osc.frequency.value = frecuencia;
  volumen.gain.setValueAtTime(0.0001, t);
  volumen.gain.exponentialRampToValueAtTime(fuerza, t + 0.02);
  volumen.gain.exponentialRampToValueAtTime(0.0001, t + duracion);
  osc.connect(volumen);
  volumen.connect(audio.destination);
  osc.start(t);
  osc.stop(t + duracion + 0.05);
}

// 6a) CLINK DE CRISTAL: tres notas sonando juntas que se apagan poco a poco.
function sonidoClink() {
  if (!audio) return;
  const t = audio.currentTime;
  const notas = [ [1400, 0.5], [3250, 0.3], [5950, 0.15] ];   // [frecuencia, fuerza]
  notas.forEach(([frecuencia, fuerza]) => {
    const osc = audio.createOscillator();
    const volumen = audio.createGain();
    osc.type = "sine";
    osc.frequency.value = frecuencia;
    volumen.gain.setValueAtTime(fuerza, t);
    volumen.gain.exponentialRampToValueAtTime(0.001, t + 0.7);
    osc.connect(volumen);
    volumen.connect(audio.destination);
    osc.start(t);
    osc.stop(t + 0.7);
  });
}

// 6b) TRAMPOLÍN: un "boing" cuya nota sube rápido y luego baja y rebota como resorte.
function sonidoTrampolin() {
  if (!audio) return;
  const t = audio.currentTime;
  const osc = audio.createOscillator();
  const volumen = audio.createGain();
  osc.type = "triangle";
  osc.frequency.setValueAtTime(160, t);
  osc.frequency.exponentialRampToValueAtTime(620, t + 0.07);   // sube de golpe
  osc.frequency.exponentialRampToValueAtTime(230, t + 0.20);   // baja
  osc.frequency.exponentialRampToValueAtTime(430, t + 0.30);   // rebota
  osc.frequency.exponentialRampToValueAtTime(270, t + 0.45);   // se calma
  volumen.gain.setValueAtTime(0.6, t);
  volumen.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
  osc.connect(volumen);
  volumen.connect(audio.destination);
  osc.start(t);
  osc.stop(t + 0.5);
}

// 6c) PERDISTE: el "¡aaah!" de una multitud decepcionada. Varias voces graves que bajan de tono.
function sonidoPerdiste() {
  if (!audio) return;
  const t = audio.currentTime;
  const master = audio.createGain();
  master.gain.setValueAtTime(0.0001, t);
  master.gain.exponentialRampToValueAtTime(0.4, t + 0.1);
  master.gain.exponentialRampToValueAtTime(0.0001, t + 1.5);

  const filtro = audio.createBiquadFilter();   // le da forma de "vocal" al sonido
  filtro.type = "bandpass";
  filtro.Q.value = 1.2;
  filtro.frequency.setValueAtTime(950, t);
  filtro.frequency.exponentialRampToValueAtTime(480, t + 1.3);

  const vibrato = audio.createOscillator();    // pequeño temblor de la voz
  const fuerzaVibrato = audio.createGain();
  vibrato.frequency.value = 6;
  fuerzaVibrato.gain.value = 7;
  vibrato.connect(fuerzaVibrato);
  vibrato.start(t);
  vibrato.stop(t + 1.5);

  [0, 14, -18, 30].forEach((desafine) => {     // cuatro "personas" ligeramente distintas
    const voz = audio.createOscillator();
    voz.type = "sawtooth";
    voz.detune.value = desafine;
    voz.frequency.setValueAtTime(340, t);
    voz.frequency.exponentialRampToValueAtTime(140, t + 1.3);
    fuerzaVibrato.connect(voz.frequency);
    voz.connect(filtro);
    voz.start(t);
    voz.stop(t + 1.5);
  });

  filtro.connect(master);
  master.connect(audio.destination);
}

// 6d) CELEBRACIÓN DE COLOR: tres notas brillantes que suben, como una chispa.
function sonidoColor() {
  if (!audio) return;
  nota(1047, 0.00, 0.30, "sine", 0.35);
  nota(1319, 0.07, 0.30, "sine", 0.35);
  nota(1568, 0.14, 0.45, "sine", 0.35);
  nota(2093, 0.21, 0.55, "sine", 0.25);
}

// 6e) NIVEL COMPLETO: una fanfarria de trompetas y un acorde final.
function sonidoNivel() {
  if (!audio) return;
  [523, 659, 784, 1047].forEach((frecuencia, i) => {
    nota(frecuencia, i * 0.16, 0.28, "square", 0.10);
    nota(frecuencia, i * 0.16, 0.28, "triangle", 0.25);
  });
  [1047, 1319, 1568].forEach((frecuencia) => {
    nota(frecuencia, 0.75, 1.1, "triangle", 0.25);
    nota(frecuencia, 0.75, 1.1, "square", 0.06);
  });
  nota(2093, 0.75, 1.1, "sine", 0.15);
}

// Botón de prueba: cada clic suena un sonido distinto, sin necesidad de jugar.
const pruebas = [
  ["clink de cristal", sonidoClink],
  ["trampolín", sonidoTrampolin],
  ["color completo", sonidoColor],
  ["nivel completo", sonidoNivel],
  ["perdiste", sonidoPerdiste]
];
let turnoPrueba = 0;
const botonProbar = document.getElementById("probar");
const textoAudio = document.getElementById("audioEstado");
botonProbar.addEventListener("click", async () => {
  try {
    activarAudio();
    await audio.resume();
    const [nombre, sonido] = pruebas[turnoPrueba];
    sonido();
    textoAudio.textContent = "Sonó: " + nombre + " (audio " + audio.state + ")";
    turnoPrueba = (turnoPrueba + 1) % pruebas.length;
  } catch (error) {
    textoAudio.textContent = "Error de audio: " + error.message;
  }
  botonProbar.blur();   // así la barra espaciadora no vuelve a presionar este botón
});

// 7) EFECTOS DE CELEBRACIÓN: chispas, confeti y letreros que flotan.
let particulas = [];
let textos = [];

function lanzarChispas(x, y, color, cantidad) {
  for (let i = 0; i < cantidad; i++) {
    const angulo = Math.random() * Math.PI * 2;
    const fuerza = 2 + Math.random() * 4;
    particulas.push({
      x, y, color, forma: "circulo",
      dx: Math.cos(angulo) * fuerza, dy: Math.sin(angulo) * fuerza - 1,
      gravedad: 0.12, vida: 45 + Math.random() * 30,
      tam: 2.5 + Math.random() * 3, giro: 0, velGiro: 0
    });
  }
}

function lanzarConfeti(cantidad) {
  for (let i = 0; i < cantidad; i++) {
    particulas.push({
      x: Math.random() * lienzo.width, y: -10,
      color: colores[Math.floor(Math.random() * colores.length)], forma: "confeti",
      dx: (Math.random() - 0.5) * 3, dy: 1 + Math.random() * 3,
      gravedad: 0.03, vida: 160 + Math.random() * 60,
      tam: 5 + Math.random() * 5, giro: Math.random() * 6, velGiro: (Math.random() - 0.5) * 0.4
    });
  }
}

function textoFlotante(texto, x, y, color) {
  textos.push({ texto, x, y, color, vida: 100 });
}

function actualizarEfectos() {
  for (const p of particulas) {
    p.x += p.dx; p.y += p.dy; p.dy += p.gravedad; p.giro += p.velGiro; p.vida--;
  }
  particulas = particulas.filter(p => p.vida > 0 && p.y < lienzo.height + 20);
  for (const t of textos) { t.y -= 0.6; t.vida--; }
  textos = textos.filter(t => t.vida > 0);
}

function dibujarEfectos() {
  for (const p of particulas) {
    pincel.globalAlpha = Math.min(1, p.vida / 30);
    pincel.fillStyle = p.color;
    if (p.forma === "circulo") {
      pincel.beginPath();
      pincel.arc(p.x, p.y, p.tam, 0, Math.PI * 2);
      pincel.fill();
    } else {
      pincel.save();
      pincel.translate(p.x, p.y);
      pincel.rotate(p.giro);
      pincel.fillRect(-p.tam / 2, -p.tam / 4, p.tam, p.tam / 2);
      pincel.restore();
    }
  }
  pincel.globalAlpha = 1;
  pincel.textAlign = "center";
  pincel.font = "bold 26px Georgia";
  pincel.lineWidth = 5;
  pincel.lineJoin = "round";
  for (const t of textos) {
    pincel.globalAlpha = Math.min(1, t.vida / 30);
    pincel.strokeStyle = "rgba(0,0,0,0.7)";
    pincel.strokeText(t.texto, t.x, t.y);
    pincel.fillStyle = t.color;
    pincel.fillText(t.texto, t.x, t.y);
  }
  pincel.globalAlpha = 1;
}

// 8) CONTROLES: el juego "escucha" el teclado y el mouse.
const teclas = {};
document.addEventListener("keydown", (e) => {
  if (e.target && ["INPUT", "TEXTAREA"].includes(e.target.tagName)) return;   // escribiendo en el formulario
  if (vistaActual !== null) return;                                            // hay una ventana abierta
  teclas[e.key] = true;
  if (e.key === " ") { e.preventDefault(); botonEspacio(); }
});
document.addEventListener("keyup", (e) => { teclas[e.key] = false; });

// Mover la barra: funciona con el mouse y con el dedo (arrastrando sobre el juego).
function moverBarra(e) {
  const caja = lienzo.getBoundingClientRect();
  const escala = lienzo.width / lienzo.clientWidth;
  barra.x = (e.clientX - caja.left - lienzo.clientLeft) * escala - barra.ancho / 2;
}
lienzo.addEventListener("pointerdown", (e) => {
  moverBarra(e);
  if (e.pointerType === "touch") lienzo.setPointerCapture(e.pointerId);
});
lienzo.addEventListener("pointermove", moverBarra);
lienzo.addEventListener("pointerup", (e) => {
  if (e.pointerType === "touch") {
    // Con el dedo: al levantarlo se inicia el nivel o se reinicia la partida (nunca se pausa).
    if (estado === "esperando" || estado === "terminado") botonEspacio();
  } else {
    botonEspacio();   // con el mouse: un clic inicia o pausa, como antes
  }
});

// Botón de pausa para el celular.
document.getElementById("pausa").addEventListener("click", (e) => {
  botonEspacio();
  e.currentTarget.blur();
});

function botonEspacio() {
  activarAudio();
  if (!jugador) {                                  // sin cuenta no se juega
    if (vistaActual === null) abrirModal("cuenta");
    return;
  }
  if (Date.now() < bloqueoHasta) return;   // pequeña espera tras perder una vida o terminar
  if (estado === "esperando") estado = "jugando";
  else if (estado === "jugando") estado = "esperando";   // pausa
  else if (estado === "terminado") reiniciar();
  // durante la celebración de nivel no hace nada
}

// 9) REGLAS DEL JUEGO
function reiniciar() {
  puntos = 0; vidas = 3; nivel = 1;
  particulas = []; textos = [];
  crearLadrillos(); colocarPelota(); estado = "esperando";
}

function colocarPelota() {
  pelota.x = barra.x + barra.ancho / 2;
  pelota.y = barra.y - pelota.radio - 2;
  const rapidez = 4 + (nivel - 1) * 0.8;          // cada nivel es más rápido
  pelota.dx = rapidez * (Math.random() < 0.5 ? -1 : 1);
  pelota.dy = -rapidez;
}

function actualizarMarcador() {
  document.getElementById("nivelTexto").textContent = nivel;
  document.getElementById("puntos").textContent = puntos;
  document.getElementById("vidas").textContent = vidas;
}

// 10) ACTUALIZAR: se ejecuta ~60 veces por segundo y mueve todo.
function actualizar() {
  if (teclas["ArrowLeft"])  barra.x -= barra.velocidad;
  if (teclas["ArrowRight"]) barra.x += barra.velocidad;
  barra.x = Math.max(0, Math.min(lienzo.width - barra.ancho, barra.x));

  // Celebración de nivel: lluvia de confeti y cuenta regresiva para el siguiente nivel.
  if (estado === "nivelCompleto") {
    faseFondo += 0.01;
    cuentaNivel--;
    if (cuentaNivel > 80) lanzarConfeti(3);
    if (cuentaNivel === 150 || cuentaNivel === 110) {
      for (let k = 0; k < 3; k++) {
        lanzarChispas(100 + Math.random() * 440, 80 + Math.random() * 150, colores[Math.floor(Math.random() * colores.length)], 22);
      }
    }
    if (cuentaNivel <= 0) {
      nivel++;
      crearLadrillos();
      colocarPelota();
      estado = "esperando";
      bloqueoHasta = Date.now() + 700;
    }
    return;
  }

  if (estado !== "jugando") {
    if (estado === "esperando") { pelota.x = barra.x + barra.ancho / 2; pelota.y = barra.y - pelota.radio - 2; }
    return;
  }

  faseFondo += 0.004;   // el fondo cambia de color solo mientras se juega

  pelota.x += pelota.dx;
  pelota.y += pelota.dy;

  if (pelota.x < pelota.radio || pelota.x > lienzo.width - pelota.radio) pelota.dx *= -1;
  if (pelota.y < pelota.radio) pelota.dy *= -1;

  const tocaBarra = pelota.y + pelota.radio >= barra.y &&
                    pelota.y - pelota.radio <= barra.y + barra.alto &&
                    pelota.x >= barra.x && pelota.x <= barra.x + barra.ancho &&
                    pelota.dy > 0;
  if (tocaBarra) {
    const posicion = (pelota.x - (barra.x + barra.ancho / 2)) / (barra.ancho / 2);
    const rapidez = Math.hypot(pelota.dx, pelota.dy);
    pelota.dx = posicion * rapidez * 0.8;
    pelota.dy = -Math.sqrt(rapidez * rapidez - pelota.dx * pelota.dx);
    sonidoTrampolin();   // ¡boing!
  }

  // Choque con ladrillos redondos: si la distancia entre centros es menor
  // que la suma de los dos radios, se tocan.
  for (const l of ladrillos) {
    if (!l.vivo) continue;
    const difX = pelota.x - l.x;
    const difY = pelota.y - l.y;
    if (Math.hypot(difX, difY) < pelota.radio + radioLadrillo) {
      l.vivo = false;
      if (Math.abs(difX) > Math.abs(difY)) pelota.dx *= -1;   // golpe de lado
      else pelota.dy *= -1;                                    // golpe de arriba o abajo
      puntos += 10;
      sonidoClink();
      lanzarChispas(l.x, l.y, l.color, 8);

      // ¿Se acabó todo un grupo de color? ¡Celebración aparte!
      const grupo = ladrillos.filter(b => b.fila === l.fila);
      if (grupo.every(b => !b.vivo)) {
        puntos += 50;
        sonidoColor();
        for (const b of grupo) lanzarChispas(b.x, b.y, b.color, 7);
        textoFlotante("¡COLOR COMPLETO! +50", lienzo.width / 2, l.y, l.color);
      }
      break;
    }
  }

  // ¿Terminaste el nivel? (no quedan círculos vivos)
  if (ladrillos.every(b => !b.vivo)) {
    puntos += 100 * nivel;
    estado = "nivelCompleto";
    cuentaNivel = 200;
    sonidoNivel();
    guardarPuntaje();
  }

  if (pelota.y > lienzo.height + pelota.radio) {
    vidas--;
    if (vidas <= 0) { estado = "terminado"; bloqueoHasta = Date.now() + 1200; sonidoPerdiste(); guardarPuntaje(); }
    else { colocarPelota(); estado = "esperando"; bloqueoHasta = Date.now() + 700; }
  }
}

// 11) DIBUJAR AL NIÑO: un muñequito hecho con círculos y rayas.
//     Cuando sube tiene los brazos arriba y las piernas dobladas; cuando baja abre los brazos.
function dibujarNino() {
  const x = pelota.x, y = pelota.y, s = pelota.radio;
  const subiendo = pelota.dy < 0 || estado === "nivelCompleto";   // en la celebración festeja con los brazos arriba
  pincel.save();
  pincel.lineCap = "round";
  pincel.lineJoin = "round";

  // Piernas
  pincel.strokeStyle = "#2b4c9b";
  pincel.lineWidth = 4;
  pincel.beginPath();
  if (subiendo) {
    pincel.moveTo(x, y + 0.4 * s); pincel.lineTo(x - 0.5 * s, y + 0.7 * s); pincel.lineTo(x - 0.35 * s, y + s);
    pincel.moveTo(x, y + 0.4 * s); pincel.lineTo(x + 0.5 * s, y + 0.7 * s); pincel.lineTo(x + 0.35 * s, y + s);
  } else {
    pincel.moveTo(x, y + 0.4 * s); pincel.lineTo(x - 0.5 * s, y + s);
    pincel.moveTo(x, y + 0.4 * s); pincel.lineTo(x + 0.5 * s, y + s);
  }
  pincel.stroke();

  // Brazos
  pincel.strokeStyle = "#ffd3a8";
  pincel.lineWidth = 3.5;
  pincel.beginPath();
  if (subiendo) {
    pincel.moveTo(x, y - 0.1 * s); pincel.lineTo(x - 0.95 * s, y - 0.95 * s);
    pincel.moveTo(x, y - 0.1 * s); pincel.lineTo(x + 0.95 * s, y - 0.95 * s);
  } else {
    pincel.moveTo(x, y - 0.1 * s); pincel.lineTo(x - 1.05 * s, y - 0.3 * s);
    pincel.moveTo(x, y - 0.1 * s); pincel.lineTo(x + 1.05 * s, y - 0.3 * s);
  }
  pincel.stroke();

  // Cuerpo (camiseta roja)
  pincel.strokeStyle = "#e63946";
  pincel.lineWidth = 7;
  pincel.beginPath();
  pincel.moveTo(x, y - 0.15 * s);
  pincel.lineTo(x, y + 0.4 * s);
  pincel.stroke();

  // Cabeza
  const cy = y - 0.68 * s, r = 0.45 * s;
  pincel.fillStyle = "#ffd3a8";
  pincel.beginPath();
  pincel.arc(x, cy, r, 0, Math.PI * 2);
  pincel.fill();

  // Pelo
  pincel.fillStyle = "#5a3a1e";
  pincel.beginPath();
  pincel.arc(x, cy, r, Math.PI, 0);
  pincel.fill();

  // Ojos y sonrisa
  pincel.fillStyle = "#222";
  pincel.beginPath(); pincel.arc(x - 0.16 * s, cy + 0.04 * s, 1.1, 0, Math.PI * 2); pincel.fill();
  pincel.beginPath(); pincel.arc(x + 0.16 * s, cy + 0.04 * s, 1.1, 0, Math.PI * 2); pincel.fill();
  pincel.strokeStyle = "#222";
  pincel.lineWidth = 1.2;
  pincel.beginPath();
  pincel.arc(x, cy + 0.12 * s, 0.17 * s, 0.1 * Math.PI, 0.9 * Math.PI);
  pincel.stroke();

  pincel.restore();
}

// 12) DIBUJAR: pinta el fondo de color y luego todo lo demás encima.
function dibujar() {
  pincel.fillStyle = colorFondo();
  pincel.fillRect(0, 0, lienzo.width, lienzo.height);

  for (const l of ladrillos) {
    if (!l.vivo) continue;
    pincel.beginPath();
    pincel.arc(l.x, l.y, radioLadrillo, 0, Math.PI * 2);
    pincel.fillStyle = l.color;
    pincel.fill();
    pincel.strokeStyle = "rgba(255,255,255,0.7)";
    pincel.lineWidth = 2;
    pincel.stroke();
  }

  pincel.fillStyle = "#fca311";
  pincel.fillRect(barra.x, barra.y, barra.ancho, barra.alto);

  dibujarNino();
  dibujarEfectos();

  pincel.textAlign = "center";

  if (estado === "esperando") {
    pincel.fillStyle = "#ffffff";
    pincel.font = "bold 24px Georgia";
    pincel.fillText(`Nivel ${nivel}: ${textoAccion}`, lienzo.width / 2, 340);
    if (nivel > 1) {
      pincel.font = "16px Georgia";
      pincel.fillText("¡Más rápido, más filas y círculos más chicos!", lienzo.width / 2, 366);
    }
  }

  if (estado === "nivelCompleto") {
    pincel.fillStyle = "rgba(0,0,0,0.45)";
    pincel.fillRect(60, 130, 520, 150);
    pincel.fillStyle = "#ffd84d";
    pincel.font = "bold 38px Georgia";
    pincel.fillText(`¡NIVEL ${nivel} COMPLETO!`, lienzo.width / 2, 185);
    pincel.fillStyle = "#ffffff";
    pincel.font = "20px Georgia";
    pincel.fillText(`Bonus: +${100 * nivel} puntos`, lienzo.width / 2, 222);
    pincel.font = "17px Georgia";
    pincel.fillText(`Prepárate para el nivel ${nivel + 1}: más rápido y más difícil`, lienzo.width / 2, 256);
  }

  if (estado === "terminado") {
    // Pantalla oscurecida y una X roja grande
    pincel.fillStyle = "rgba(0,0,0,0.5)";
    pincel.fillRect(0, 0, lienzo.width, lienzo.height);
    pincel.strokeStyle = "#ff1e1e";
    pincel.lineWidth = 18;
    pincel.lineCap = "round";
    pincel.beginPath();
    pincel.moveTo(260, 110); pincel.lineTo(380, 230);
    pincel.moveTo(380, 110); pincel.lineTo(260, 230);
    pincel.stroke();

    pincel.fillStyle = "#ffffff";
    pincel.font = "bold 24px Georgia";
    pincel.fillText("Fin del juego", lienzo.width / 2, 300);
    pincel.font = "18px Georgia";
    pincel.fillText(`Llegaste al nivel ${nivel} con ${puntos} puntos. ${esTactil ? "Toca" : "Espacio"} para jugar otra vez`, lienzo.width / 2, 335);
  }
}

// 13) BUCLE DEL JUEGO: repite actualizar + dibujar sin parar.
function bucle() {
  actualizar();
  actualizarEfectos();
  actualizarMarcador();
  dibujar();
  requestAnimationFrame(bucle);
}

const SUPABASE_URL = "https://iuzasiuwgztlurnmcdpe.supabase.co";
const SUPABASE_KEY = "sb_publishable_PhiL_FLSl316sfN0r0qIgQ_PtZ49Qqd";

let supa = null;            // la conexión con Supabase
let jugador = null;         // quien inició sesión: { id, usuario, mejor }
let modoRegistro = false;   // ¿el formulario está en "Crear cuenta"?

const modal = document.getElementById("modal");
const mensajeCuenta = document.getElementById("mensajeCuenta");
const campoUsuario = document.getElementById("campoUsuario");
const campoCorreo = document.getElementById("campoCorreo");
const campoClave = document.getElementById("campoClave");
const botonEnviar = document.getElementById("enviarCuenta");

function abrirModal(vista) {
  vistaActual = vista;
  if (estado === "jugando") estado = "esperando";   // el juego se pausa
  modal.classList.remove("oculto");
  // Sin cuenta no se puede cerrar la ventana de entrada: hay que entrar para jugar.
  document.getElementById("cerrarModal").classList.toggle("oculto", vista === "cuenta" && !jugador);
  document.getElementById("vistaCuenta").classList.toggle("oculto", vista !== "cuenta");
  document.getElementById("vistaRanking").classList.toggle("oculto", vista !== "ranking");
}

function cerrarModal() {
  if (vistaActual === "cuenta" && !jugador) return;   // sin cuenta, la ventana de entrada no se cierra
  const eraRanking = vistaActual === "ranking";
  vistaActual = null;
  modal.classList.add("oculto");
  bloqueoHasta = Date.now() + 400;   // para que el toque de cerrar no inicie el juego
  if (!jugador && eraRanking) abrirModal("cuenta");   // sin cuenta no se puede jugar
}

function ponerModo(registro) {
  modoRegistro = registro;
  document.getElementById("pestEntrar").classList.toggle("activa", !registro);
  document.getElementById("pestCrear").classList.toggle("activa", registro);
  document.getElementById("lblUsuario").classList.toggle("oculto", !registro);
  botonEnviar.textContent = registro ? "Crear mi cuenta" : "Entrar";
  campoClave.autocomplete = registro ? "new-password" : "current-password";
  mensajeCuenta.textContent = "";
}

function actualizarCuentaUI() {
  const texto = document.getElementById("cuentaTexto");
  const boton = document.getElementById("btnCuenta");
  if (!supa) {
    texto.textContent = "Sin conexión con el servidor";
    boton.classList.add("oculto");
    return;
  }
  boton.classList.remove("oculto");
  if (jugador) {
    texto.textContent = "👤 " + jugador.usuario + " · Mejor: " + jugador.mejor;
    boton.textContent = "Salir";
  } else {
    texto.textContent = "Inicia sesión para jugar";
    boton.textContent = "👤 Entrar / Crear cuenta";
  }
}

function traducirError(err) {
  const texto = String((err && err.message) || err || "").toLowerCase();
  if (texto.includes("invalid login")) return "Correo o contraseña incorrectos.";
  if (texto.includes("already registered")) return "Ese correo ya tiene una cuenta. Prueba en «Entrar».";
  if (texto.includes("password")) return "La contraseña no es válida. Usa al menos 8 caracteres.";
  if (texto.includes("email") && texto.includes("invalid")) return "Ese correo no es válido.";
  if (texto.includes("rate limit") || texto.includes("too many")) return "Demasiados intentos. Espera unos minutos.";
  if (texto.includes("database error")) return "No se pudo crear la cuenta. Prueba con otro usuario.";
  if (texto.includes("fetch") || texto.includes("network")) return "No hay conexión con internet.";
  return "Algo salió mal: " + ((err && err.message) || "error desconocido");
}

async function cargarJugador(sesion) {
  let datos = null;
  try {
    const { data } = await supa.from("puntajes")
      .select("usuario, mejor_puntaje")
      .eq("user_id", sesion.user.id)
      .maybeSingle();
    datos = data;
  } catch (e) { console.warn("No se pudo leer el perfil", e); }
  jugador = {
    id: sesion.user.id,
    usuario: datos ? datos.usuario : "Jugador",
    mejor: datos ? datos.mejor_puntaje : 0
  };
  actualizarCuentaUI();
  if (vistaActual === "cuenta") cerrarModal();
}

async function enviarFormulario() {
  if (!supa) { mensajeCuenta.textContent = "No hay conexión con el servidor."; return; }
  const usuario = campoUsuario.value.trim();
  const correo = campoCorreo.value.trim();
  const clave = campoClave.value;
  if (!correo || !clave) { mensajeCuenta.textContent = "Escribe tu correo y tu contraseña."; return; }
  if (modoRegistro) {
    if (!/^[A-Za-z0-9_]{3,16}$/.test(usuario)) {
      mensajeCuenta.textContent = "El usuario debe tener de 3 a 16 letras, números o _ (sin espacios).";
      return;
    }
    if (clave.length < 8) { mensajeCuenta.textContent = "La contraseña debe tener al menos 8 caracteres."; return; }
  }
  botonEnviar.disabled = true;
  mensajeCuenta.textContent = "Un momento…";
  try {
    if (modoRegistro) {
      const { data: libre, error: errLibre } = await supa.rpc("usuario_disponible", { p_usuario: usuario });
      if (errLibre) throw errLibre;
      if (!libre) { mensajeCuenta.textContent = "Ese usuario ya está ocupado. Elige otro."; return; }
      const { data, error } = await supa.auth.signUp({ email: correo, password: clave, options: { data: { usuario } } });
      if (error) throw error;
      if (!data.session) mensajeCuenta.textContent = "Cuenta creada. Revisa tu correo para confirmarla.";
    } else {
      const { error } = await supa.auth.signInWithPassword({ email: correo, password: clave });
      if (error) throw error;
    }
    campoClave.value = "";
  } catch (err) {
    mensajeCuenta.textContent = traducirError(err);
  } finally {
    botonEnviar.disabled = false;
  }
}

async function guardarPuntaje() {
  if (!supa || !jugador || puntos <= 0) return;
  const esRecord = puntos > jugador.mejor;
  try {
    const { error } = await supa.rpc("guardar_puntaje", { p_puntos: puntos, p_nivel: nivel });
    if (error) throw error;
    if (esRecord) {
      jugador.mejor = puntos;
      actualizarCuentaUI();
      textoFlotante("¡NUEVO RÉCORD! 🏆", lienzo.width / 2, 90, "#ffd84d");
    }
  } catch (e) { console.warn("No se pudo guardar el puntaje", e); }
}

async function mostrarRanking() {
  abrirModal("ranking");
  const lista = document.getElementById("listaRanking");
  const aviso = document.getElementById("mensajeRanking");
  lista.replaceChildren();
  if (!supa) { aviso.textContent = "El ranking no está disponible ahora."; return; }
  aviso.textContent = "Cargando…";
  try {
    const { data, error } = await supa.from("puntajes")
      .select("usuario, mejor_puntaje, mejor_nivel")
      .gt("mejor_puntaje", 0)
      .order("mejor_puntaje", { ascending: false })
      .limit(10);
    if (error) throw error;
    aviso.textContent = data.length ? "" : "Todavía no hay puntajes. ¡Sé el primero!";
    data.forEach((fila, i) => {
      const li = document.createElement("li");
      const izquierda = document.createElement("span");
      const derecha = document.createElement("span");
      const medalla = ["🥇", "🥈", "🥉"][i] || (i + 1) + ".";
      izquierda.textContent = medalla + " " + fila.usuario;
      derecha.textContent = fila.mejor_puntaje + " pts · nivel " + fila.mejor_nivel;
      if (jugador && fila.usuario === jugador.usuario) li.className = "yo";
      li.append(izquierda, derecha);
      lista.appendChild(li);
    });
  } catch (e) {
    aviso.textContent = "No se pudo cargar el ranking.";
  }
}

function iniciarSupabase() {
  if (!window.supabase || !window.supabase.createClient) {
    actualizarCuentaUI();
    mensajeCuenta.textContent = "No se pudo conectar con el servidor. Revisa tu internet y recarga la página.";
    abrirModal("cuenta");
    return;
  }
  supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  supa.auth.onAuthStateChange((evento, sesion) => {
    setTimeout(async () => {
      if (sesion && sesion.user) {
        await cargarJugador(sesion);
      } else {
        jugador = null;
        actualizarCuentaUI();
        ponerModo(false);
        abrirModal("cuenta");   // sin sesión, siempre se pide la cuenta
      }
    }, 0);
  });
}
